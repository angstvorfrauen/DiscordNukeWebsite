<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RocketClient</title>
  <link rel="stylesheet" href="./CSS/index.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <div id="session-info"></div>
  <div id="start-session-result"></div>
  <div class="toast-container">
    <div class="toast">
      <i class="fas fa-info-circle"></i>
      <span id="toast-username">TEST DO BETA HTTPS://T.ME/ROCKETCLIENT2</span>
      <button class="close-btn" aria-label="Close">&times;</button>
    </div>
  </div>
  <div class="navbar">
    <span class="brand">
      <i class="fas fa-rocket logo-icon"></i> RocketClient
    </span>
    <span class="user" id="username-display">BETA TEST</span>
    <a href="index.html" class="settings-icon" aria-label="Settings">
      <i class="fas fa-cog"></i>
    </a>
  </div>
  <div class="container">
    <h1>Connect Discord Bot</h1>
    <div class="card outui">
      <p class="label">Bot Token</p>
      <div class="input-row">
        <div class="input-group">
          <i class="fas fa-key"></i>
          <input type="text" id="token" placeholder="Enter your bot token" />
        </div>
        <button class="ban-btn" onclick="connectBot()" id="connectBtn">
          <i class="fas fa-plug"></i>
        </button>
      </div>
      <button onclick="stopBot()" id="stopBtn" style="display: none;" class="btn-danger">
        <i class="fas fa-power-off"></i> Stop Bot
      </button>
      <p id="response" class="small">Status: Not connected</p>
    </div>
  </div>
  <div class="footer">
    <p>© RocketClient 2025</p>
  </div>
  <script src="./JS/index.js"></script>
</body>
</html>
